# Project-wide Gradle settings.
# NOTE: The build is tuned to run on a low-memory CI/sandbox (<= 4 GB RAM).
# If you have more memory, you can safely raise these values.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx768m

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
