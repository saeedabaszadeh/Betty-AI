# Betty AI — example non-secret configuration
#
# Copy this file to `config.properties` if you want to pre-seed non-secret defaults
# for a build. NOTE: this file must NEVER contain secrets. The AI API key is entered
# by the user at runtime and stored encrypted (Android Keystore) — never here.
#
# All of these values can also be changed at runtime in the in-app Settings screen,
# which is the recommended way for end users.

# Language used for prompts and replies (BCP-47 tag).
betty.language=fa-IR

# Wake phrase (documentation only; the phrase is handled by the WakeWordEngine).
betty.wakeWord=سلام بتی

# AI provider id (must match an AIProvider.id registered in ProviderModule).
betty.ai.provider=openai_compatible

# Base URL of an OpenAI-compatible chat-completions endpoint.
# Examples:
#   OpenAI:        https://api.openai.com/v1
#   OpenRouter:    https://openrouter.ai/api/v1
#   Local server:  http://10.0.2.2:1234/v1
betty.ai.baseUrl=

# Model name understood by the endpoint.
betty.ai.model=gpt-4o-mini

# Feature toggles (defaults; user can override in Settings).
betty.enabled=true
betty.voice.enabled=true
betty.wakeWord.enabled=false
